<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - videobelajar</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
 
  <!-- navbar atas, cuma logo -->
  <div class="topbar">
    <div class="logo"><span class="orange">video</span><span class="red">belajar</span></div>
  </div>
 
  <!-- card login di tengah halaman -->
  <div class="auth-wrapper">
    <div class="auth-card">
 
      <h2>Masuk ke Akun</h2>
      <p class="subtitle">Yuk, lanjutin belajarmu di videobelajar.</p>
 
      <div class="form-group">
        <label>E-Mail <span class="required">*</span></label>
        <input type="email" placeholder="nama@email.com">
      </div>
 
      <div class="form-group">
        <label>Kata Sandi <span class="required">*</span></label>
        <input type="password" placeholder="masukkan kata sandi">
      </div>
 
      <a href="#" class="forgot-link">Lupa Password?</a>
 
      <a href="beranda.html" class="btn btn-green">Masuk</a>
      <a href="register.html" class="btn btn-green-light">Daftar</a>
 
      <p class="or-divider">atau</p>
 
      <a href="#" class="btn btn-white">Masuk dengan Google</a>
 
    </div>
  </div>
 
</body>
</html>
