<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daftar - videobelajar</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="topbar">
    <div class="logo"><span class="orange">video</span><span class="red">belajar</span></div>
  </div>

  <div class="auth-wrapper">
    <div class="auth-card">

      <h2>Pendaftaran Akun</h2>
      <p class="subtitle">Yuk, daftarkan akunmu sekarang juga!</p>

      <div class="form-group">
        <label>Nama Lengkap <span class="required">*</span></label>
        <input type="text" placeholder="nama lengkap kamu">
      </div>

      <div class="form-group">
        <label>E-Mail <span class="required">*</span></label>
        <input type="email" placeholder="nama@email.com">
      </div>

      <div class="form-group">
        <label>No. Hp <span class="required">*</span></label>
        <div class="phone-row">
          <select>
            <option>+62</option>
          </select>
          <input type="tel" placeholder="8xxxxxxxxx">
        </div>
      </div>

      <div class="form-group">
        <label>Kata Sandi <span class="required">*</span></label>
        <input type="password" placeholder="buat kata sandi">
      </div>

      <div class="form-group">
        <label>Konfirmasi Kata Sandi <span class="required">*</span></label>
        <input type="password" placeholder="ulangi kata sandi">
      </div>

      <a href="#" class="forgot-link">Lupa Password?</a>

      <a href="login.html" class="btn btn-green">Daftar</a>
      <a href="login.html" class="btn btn-green-light">Masuk</a>

      <p class="or-divider">atau</p>

      <a href="#" class="btn btn-white">Daftar dengan Google</a>

    </div>
  </div>

</body>
</html>
